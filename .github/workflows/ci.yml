# CI: runs on every push and pull request.
#   test       Python unit tests (moto, no AWS) with a coverage gate
#   terraform  fmt + validate for both stacks + `terraform test` of the tag-value rule (no AWS access needed)
#   frontend   npm ci, typecheck, production build
#   plan       PULL REQUESTS ONLY: read-only `terraform plan` via OIDC, posted as a PR comment
# A green CI run on main triggers deploy.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  AWS_REGION: ap-south-1

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (fails under 85% coverage)
        run: python -m pytest --cov=src --cov-report=term --cov-fail-under=85

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: tag values are validated at plan time (terraform test, no AWS)
        run: terraform -chdir=infra/modules/tag_values init -input=false && terraform -chdir=infra/modules/tag_values test
      - name: validate infra/main
        run: terraform -chdir=infra/main init -backend=false -input=false && terraform -chdir=infra/main validate
      - name: validate infra/bootstrap
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # vitest: unit tests of the storefront (e.g. the 503 "busy, retrying" logic)
      - run: npm run build

  plan:
    name: Terraform plan (PR comment)
    if: github.event_name == 'pull_request'
    needs: [test, terraform, frontend]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for AWS
      contents: read
      pull-requests: write # post the plan comment
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: order-saga-plan-pr-${{ github.event.number }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform plan
        working-directory: infra/main
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan
          terraform show -json tfplan > plan.json
      - name: Summarise plan
        run: python3 scripts/plan_summary.py infra/main/plan.json > plan-summary.md && cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("plan-summary.md", "utf8");
            const marker = "<!-- order-saga-terraform-plan -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((c) => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
